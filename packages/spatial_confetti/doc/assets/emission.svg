<line x1="686.75" y1="197" x2="686.75" y2="209" stroke="#64748b" stroke-width="2" stroke-dasharray=""/>
<text x="686.75" y="235" class="small" text-anchor="middle">0.75</text>
<line x1="732" y1="197" x2="732" y2="209" stroke="#64748b" stroke-width="2" stroke-dasharray=""/>
<text x="732" y="235" class="small" text-anchor="middle">1</text>
<line x1="777.25" y1="197" x2="777.25" y2="209" stroke="#64748b" stroke-width="2" stroke-dasharray=""/>
<text x="777.25" y="235" class="small" text-anchor="middle">1.25</text>
<line x1="822.5" y1="197" x2="822.5" y2="209" stroke="#64748b" stroke-width="2" stroke-dasharray=""/>
