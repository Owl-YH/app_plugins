<line x1="480" y1="86" x2="480" y2="423" stroke="#dbe3ef" stroke-width="2" stroke-dasharray=""/>
<text x="533" y="98" class="" text-anchor="start">stream：delay=500ms，rate=4/s，duration=1s</text>
