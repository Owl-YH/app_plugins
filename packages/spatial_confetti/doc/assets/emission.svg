<polygon points="947.00,203.00 934.00,198.00 934.00,208.00" fill="#64748b" stroke="none" opacity="1"/>
<line x1="551" y1="197" x2="551" y2="209" stroke="#64748b" stroke-width="2" stroke-dasharray=""/>
<text x="551" y="235" class="small" text-anchor="middle">0</text>
<line x1="641.5" y1="197" x2="641.5" y2="209" stroke="#64748b" stroke-width="2" stroke-dasharray=""/>
