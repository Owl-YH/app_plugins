<circle cx="686.75" cy="203" r="6" fill="#0d9488" opacity="1"/>
<circle cx="732" cy="203" r="6" fill="#0d9488" opacity="1"/>
<circle cx="777.25" cy="203" r="6" fill="#0d9488" opacity="1"/>
<circle cx="822.5" cy="203" r="6" fill="#0d9488" opacity="1"/>
<circle cx="641.5" cy="203" r="9" fill="#2563eb" opacity="1"/>
<text x="537" y="307" class="" text-anchor="start">蓝点：开场 burstCount（可为 0）</text>
<text x="537" y="341" class="" text-anchor="start">绿点：后续按累计 rate 出生</text>
<text x="537" y="385" class="small" text-anchor="start">每个粒子从自己的出生时刻开始计算 lifetime。</text>
<text x="537" y="413" class="small" text-anchor="start">duration 结束 ≠ 所有粒子同时消失。</text>
