<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><title>02 / 世界坐标与相机</title><rect width="1000" height="430" rx="16" fill="#f4f7fb"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#14243a;font-size:18px}.small{font-size:15px;fill:#64748b}.title{font-size:25px;font-weight:600}</style>
<text x="32" y="43" class="title" text-anchor="start">02 / 世界坐标与相机</text>
<polygon points="70.00,170.00 325.00,130.00 425.00,282.00 160.00,322.00" fill="#e2e8f0" stroke="none" opacity="1"/>
<line x1="230" y1="228" x2="402" y2="228" stroke="#2563eb" stroke-width="4" stroke-dasharray=""/>
<polygon points="402.00,228.00 389.00,223.00 389.00,233.00" fill="#2563eb" stroke="none" opacity="1"/>
<text x="347" y="208" class="" text-anchor="start">+X 向右</text>
<line x1="230" y1="228" x2="230" y2="369" stroke="#0d9488" stroke-width="4" stroke-dasharray=""/>
<polygon points="230.00,369.00 235.00,356.00 225.00,356.00" fill="#0d9488" stroke="none" opacity="1"/>
<text x="246" y="365" class="" text-anchor="start">+Y 向下</text>
<line x1="230" y1="228" x2="103" y2="318" stroke="#d97706" stroke-width="4" stroke-dasharray=""/>
<polygon points="103.00,318.00 116.50,314.56 110.72,306.40" fill="#d97706" stroke="none" opacity="1"/>
<text x="43" y="352" class="" text-anchor="start">+Z 朝相机</text>
<circle cx="230" cy="228" r="5" fill="#14243a" opacity="1"/>
<text x="194" y="203" class="" text-anchor="start">原点</text>
<line x1="495" y1="87" x2="495" y2="387" stroke="#dbe3ef" stroke-width="2" stroke-dasharray=""/>
<text x="545" y="107" class="" text-anchor="start">同样宽度，越靠近相机越大</text>
<polygon points="589.00,216.00 615.00,216.00 615.00,242.00 589.00,242.00" fill="#2563eb" stroke="none" opacity="1"/>
<text x="602" y="293" class="" text-anchor="middle">z &lt; 0</text>
<polygon points="714.00,205.00 756.00,205.00 756.00,247.00 714.00,247.00" fill="#2563eb" stroke="none" opacity="1"/>
<text x="735" y="293" class="" text-anchor="middle">z = 0</text>
<polygon points="850.00,188.00 914.00,188.00 914.00,252.00 850.00,252.00" fill="#2563eb" stroke="none" opacity="1"/>
<text x="882" y="293" class="" text-anchor="middle">z &gt; 0</text>
<text x="545" y="342" class="" text-anchor="start">viewHeight 变小 → 整体放大</text>
<text x="545" y="376" class="small" text-anchor="start">相机仅改变投影，不改变物理飞行距离。</text>
</svg>